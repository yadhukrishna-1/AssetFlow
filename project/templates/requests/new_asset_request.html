<!DOCTYPE html>
<html>
<head>
    <title>Request New Asset - AssetFlow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: #f4f4f4; padding: 15px; margin-bottom: 20px; }
        .btn { padding: 8px 16px; margin: 5px; text-decoration: none; border-radius: 4px; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-primary { background: #007bff; color: white; border: none; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        textarea { height: 100px; }

    </style>
</head>
<body>
    <div class="header">
        <h1>Request New Asset</h1>
        <a href="{% url 'employee_requests' %}" class="btn btn-secondary">← Back to Requests</a>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.category.id_for_label }}">Category:</label>
            {{ form.category }}
            <small style="color: #666; font-size: 12px;">Select the type of asset you need</small>
        </div>
        <div class="form-group">
            <label for="{{ form.description.id_for_label }}">Description:</label>
            {{ form.description }}
        </div>
        <button type="submit" class="btn btn-primary">Submit Request</button>
    </form>
</body>
</html>
