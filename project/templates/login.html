<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetFlow - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #ff7e5f; margin-bottom: 30px; font-size: 28px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; transition: all 0.3s; }
        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #ff7e5f; box-shadow: 0 0 8px rgba(255, 126, 95, 0.3); }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%); color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .messages { margin-bottom: 20px; }
        .error { color: #ff7e5f; background: #ffeaa7; padding: 12px; border-radius: 5px; border-left: 4px solid #ff7e5f; }
        .success { color: #ff7e5f; background: #ffeaa7; padding: 12px; border-radius: 5px; border-left: 4px solid #ff7e5f; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 AssetFlow</h1>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="{% if message.tags %}{{ message.tags }}{% else %}error{% endif %}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        
    </div>
    
    <footer style="text-align: center; padding: 20px; margin-top: 40px; color: #666; font-size: 12px;">
        © 2024 AssetFlow. All rights reserved.
    </footer>
</body>
</html>
